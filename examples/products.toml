# Extra SYNTHETIC products for generate-batch-records --products.
#
#   uv run generate-batch-records --batches 9 --products examples/products.toml --out data/
#
# Names and IDs are invented. Never put real product, batch or people data here.
# Every value is text, written exactly as it should appear in the CSV: quote
# numbers ("500000", "29.85"); a bare number is refused.
#
# process       "tablet" (16 steps) or "capsule" (10 steps), the built-in templates.
# id_letter     one capital letter, not B or P (taken by the built-in products).
# defects_like  optional: a built-in master with the same template whose defect
#               plan this product reuses (MBR-SYN500 for tablets, MBR-PLC250 for
#               capsules). Leave it out for clean batches only.
# limits        step_id = [min, max] for every measured step of the template and
#               nothing else; "" means no limit on that side. Reused defects need
#               the bound they break (e.g. SYN500's plan pushes S-GRAN-01 below its min).

[[product]]
master_record_id = "MBR-SYN100"
master_version   = "1"
product_name     = "Synthetol 100 mg film-coated tablets"
batch_size       = "500000"
batch_size_unit  = "tablets"
excipient        = "microcrystalline cellulose"
process          = "tablet"
id_letter        = "S"
defects_like     = "MBR-SYN500"

[product.limits]
"S-DISP-01"  = ["49.75", "50.25"]
"S-DISP-02"  = ["9.95", "10.05"]
"S-GRAN-01"  = ["6.0", "8.0"]
"S-GRAN-02"  = ["150", "200"]
"S-GRAN-03"  = ["4", "6"]
"S-GRAN-04"  = ["55", "65"]
"S-GRAN-05"  = ["1.0", "2.5"]
"S-BLEND-01" = ["10", "15"]
"S-BLEND-02" = ["8", "12"]
"S-COMP-01"  = ["190", "210"]
"S-COMP-02"  = ["6.0", "10.0"]
"S-COMP-03"  = ["3.3", "3.7"]
"S-COAT-01"  = ["55", "65"]
"S-COAT-02"  = ["2.5", "3.5"]
"S-PACK-02"  = ["99.5", "100.5"]
