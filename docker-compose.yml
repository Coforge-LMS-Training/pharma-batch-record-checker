# Local stack. See docs/containers.md for the architecture.
#
#   docker compose --profile app up --build -d    # postgres -> generator -> app
#
# Plain `docker compose up` (what `uv run pharma-review-demo` runs on the host)
# starts only postgres: generator and app are behind the `app` profile.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pharma
      POSTGRES_USER: pharma_admin
      POSTGRES_PASSWORD: pharma_admin
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharma_admin -d pharma"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - pharma_postgres:/var/lib/postgresql/data

  # One-shot: writes master_record.csv, batch_record.csv and
  # expected_findings.csv into the pharma_data volume, then exits.
  generator:
    profiles: ["app"]
    build: .
    image: pharma-review:local
    working_dir: /app
    entrypoint: ["generate-batch-records"]
    command:
      - "--batches"
      - "${BATCHES:-11}"
      - "--seed"
      - "${SEED:-0}"
      - "--catalog"
      - "catalog"
      - "--out"
      - "/data"
    volumes:
      - pharma_data:/data
    depends_on:
      postgres:
        condition: service_healthy

  # Migrates, loads /data (read-only) into postgres, and serves the pages.
  app:
    profiles: ["app"]
    build: .
    image: pharma-review:local
    entrypoint: ["pharma-review-demo", "--host", "0.0.0.0"]
    command: ["--data", "/data"]
    environment:
      DATABASE_URL: postgresql://pharma_app:pharma_app@postgres:5432/pharma
      DATABASE_ADMIN_URL: postgresql://pharma_admin:pharma_admin@postgres:5432/pharma
      PHARMA_ROOT: /app
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - pharma_data:/data:ro
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      generator:
        condition: service_completed_successfully

volumes:
  pharma_postgres:
  pharma_data:
    name: pharma_data
