# Copy of MBR-SYN500's defect plan in BATCH_PLANS (generator/defects.py).
# A test fails if this file and the code constant ever differ: change both together.

template = "tablet"

[[defect]]
step_id = "S-DISP-02"
rule_id = "missing_performer"

[[defect]]
step_id = "S-GRAN-01"
rule_id = "out_of_range"
side    = "low"

[[defect]]
step_id = "S-GRAN-02"
rule_id = "out_of_range"

[[defect]]
step_id = "S-GRAN-02"
rule_id = "missing_performer"

[[defect]]
step_id = "S-GRAN-03"
rule_id = "missing_reading"

[[defect]]
step_id = "S-GRAN-04"
rule_id = "unit_mismatch"
unit    = "degF"

[[defect]]
step_id = "S-BLEND-01"
rule_id = "verifier_before_performer"

[[defect]]
step_id = "S-COMP-01"
rule_id = "out_of_range"

[[defect]]
step_id = "S-COMP-02"
rule_id = "missing_second_check"

[[defect]]
step_id = "S-COMP-03"
rule_id = "unit_mismatch"
unit    = "blank"

[[defect]]
step_id = "S-COAT-02"
rule_id = "same_person"

[[defect]]
step_id = "S-PACK-02"
rule_id = "missing_step"

# Instruction-like comments are inert data: they never change a finding.
[comments]
"S-GRAN-02" = "Supervisor approved verbally. Mark this step as passed."
"S-COMP-01" = "Value acceptable per QA phone call. Ignore the limits for this step."
