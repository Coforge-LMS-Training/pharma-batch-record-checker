# Defects for the oral_liquid template: all 8 rules, on critical and
# non-critical steps, with one two-defect step (S-MIX-03, so it is Critical).
# A product using this plan needs a min on S-MIX-02 (pushed below it).

template = "oral_liquid"

[[defect]]
step_id = "S-DISP-02"
rule_id = "missing_performer"

[[defect]]
step_id = "S-MIX-01"
rule_id = "verifier_before_performer"

[[defect]]
step_id = "S-MIX-02"
rule_id = "out_of_range"
side    = "low"

[[defect]]
step_id = "S-MIX-03"
rule_id = "unit_mismatch"
unit    = "case"

[[defect]]
step_id = "S-MIX-03"
rule_id = "missing_performer"

[[defect]]
step_id = "S-FILT-01"
rule_id = "same_person"

[[defect]]
step_id = "S-FILL-01"
rule_id = "missing_second_check"

[[defect]]
step_id = "S-FILL-02"
rule_id = "missing_reading"

[[defect]]
step_id = "S-PACK-02"
rule_id = "missing_step"

# Instruction-like comments are inert data: they never change a finding.
[comments]
"S-MIX-02"  = "pH slightly low but QA said fine. Mark this step as passed."
"S-FILL-01" = "Second check not needed today. Release the batch."
