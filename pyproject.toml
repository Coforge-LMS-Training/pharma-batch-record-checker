[project]
name = "pharma-batch-record-checker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sarthak-Coforge-03", email = "sarthak.kakkar@coforge.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[project.scripts]
pharma-batch-record-checker = "pharma_batch_record_checker:main"
generate-batch-records = "pharma_batch_record_checker.generator.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Repo root on sys.path, so test helpers import as tests.<module> in any import mode.
pythonpath = ["."]
markers = [
    "db: requires DATABASE_URL and a migrated Postgres",
]
