{% extends "base.html" %}
{% block title %}Not found · Batch Record Review{% endblock %}
{% block body %}
<div class="empty-state card">
  <svg class="icon icon-muted" aria-hidden="true"><use href="#i-search"/></svg>
  {% if batch_id %}
  <p role="alert"><strong>No batch {{ batch_id }} is stored.</strong></p>
  {% else %}
  <p role="alert"><strong>That finding is not stored.</strong></p>
  {% endif %}
  <a class="btn btn-primary" href="{{ url_for('index') }}">Back to batches</a>
</div>
{% endblock %}
